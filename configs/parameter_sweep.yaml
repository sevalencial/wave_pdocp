experiment:
  name: wave_speed_amplitude_sweep
  seed: 42
domain:
  length: 1.0
  final_time: 2.0
discretization:
  n_interior: 100
optimal_control:
  beta: 100.0
parameter_space:
  dimension: 1
  min: 0.0
  max: 0.3
  n_samples: 100
  sampling: uniform_grid
  parameterization: wave_speed_sine_amplitude_v1
validation:
  safe_epsilon: 1.0e-15
  relative_residual_tolerance: 1.0e-9
  optimality_tolerance: 1.0e-9
  weighted_symmetry_tolerance: 1.0e-9
  positivity_tolerance: 1.0e-10
  cost_tolerance: 1.0e-10
  spectral_tolerance: 1.0e-9
  gramian_condition_warning: 1.0e10
  system_condition_warning: 1.0e8
  near_zero_eigenvalue_warning: 1.0e-12
  control_energy_warning: 1.0e6
  relative_terminal_error_warning: 0.1
  runtime_warning_seconds: 10.0
  sensitivity_outlier_factor: 10.0
mesh_refinement:
  enabled: true
  sizes: [50, 100, 200]
  representative_samples: 8
  decrease_factor_tolerance: 1.05
  absolute_error_floor: 1.0e-8
dataset:
  format: hdf5
  version: '1.0'
  split_strategy: random
  fractions: [0.75, 0.15, 0.10]
outputs:
  dataset: data/datasets/wave_pdocp_fom.h5
  snapshots: outputs/parameter_sweep/validated_snapshots.h5
  metrics: outputs/metrics/fom_parameter_sweep.csv
  refinement: outputs/metrics/fom_mesh_refinement.csv
  summary: outputs/parameter_sweep/summary.json
  figures: outputs/parameter_sweep/figures
